# =====================================================================
#  Smart Leave Management System - Spring Boot configuration
#  Secrets are NEVER hardcoded: every credential is an environment
#  variable with a safe local default (see .env.example / README).
# =====================================================================
spring.application.name=smart-leave-management

# ---------------------------- MySQL ---------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_leave_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=SmartLeaveHikari
spring.datasource.hikari.initialization-fail-timeout=60000

# ---------------------------- JPA ----------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Bootstrap schema + demo seed from database/ (bundled into the jar)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# ---------------------------- Security -----------------------------
# Empty by default: JwtService generates an ephemeral dev secret at
# startup. Provide JWT_SECRET in production so tokens survive restarts.
smartleave.security.jwt.secret=${JWT_SECRET:}
smartleave.security.jwt.issuer=smart-leave-management
smartleave.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
smartleave.security.jwt.cookie-name=SLM_TOKEN
smartleave.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# ---------------------------- Server -------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info

# ---------------------------- Logging ------------------------------
logging.level.com.smartleave=INFO
logging.level.org.hibernate.SQL=WARN
